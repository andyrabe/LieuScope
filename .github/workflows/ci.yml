name: Vérifications

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Site (types, tests, construction, poids)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run poids

  pipeline:
    name: Pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: pytest pipeline -q
