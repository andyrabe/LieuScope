name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; on laisse finir celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # enablement: true permet à l'atelier d'activer GitHub Pages lui-même,
      # sans passer par les réglages du dépôt.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Contrôle de poids
        run: npm run poids
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v5
