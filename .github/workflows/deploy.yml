name: Mise en ligne

on:
  push:
    # L'environnement « github-pages » n'accepte les mises en ligne que depuis
    # la branche par défaut du dépôt. Celle-ci est encore la branche de travail :
    # on la garde ici tant que la branche par défaut n'est pas passée à main.
    branches: [main, 'claude/validation-automatique-etapes-870mpp']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois par branche ; on laisse finir celle qui est
# en cours. La file est propre à chaque branche : sans cela, une poussée sur
# main annulait la mise en ligne de la branche par défaut, seule autorisée à
# publier, et le site restait sur sa version précédente.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # enablement: true permet à l'atelier d'activer GitHub Pages lui-même,
      # sans passer par les réglages du dépôt.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Contrôle de poids
        run: npm run poids

      - name: Prévenir si la publication va être sautée
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::warning::GitHub Pages n'accepte de publier que depuis la branche"
          echo "::warning::par défaut du dépôt (${{ github.event.repository.default_branch }})."
          echo "::warning::Le site a bien été construit, mais il ne sera pas publié depuis"
          echo "::warning::${{ github.ref_name }}. Réglage : Settings du dépôt, « Default branch »."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    # L'environnement « github-pages » refuse toute publication qui ne vient pas
    # de la branche par défaut. Tenter quand même donnerait un échec rouge à
    # chaque poussée, sans rien dire de l'état réel du site.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v5
