name: Mise en ligne

on:
  push:
    # L'environnement « github-pages » n'accepte les mises en ligne que depuis
    # la branche par défaut du dépôt. Celle-ci est encore la branche de travail :
    # on la garde ici tant que la branche par défaut n'est pas passée à main.
    branches: [main, 'claude/validation-automatique-etapes-870mpp']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois par branche ; on laisse finir celle qui est
# en cours. La file est propre à chaque branche : sans cela, une poussée sur
# main annulait la mise en ligne de la branche par défaut, seule autorisée à
# publier, et le site restait sur sa version précédente.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  construire:
    name: Construire le site
    runs-on: ubuntu-latest
    outputs:
      publier: ${{ steps.branche.outputs.publier }}
      defaut: ${{ steps.branche.outputs.defaut }}
    steps:
      - uses: actions/checkout@v7

      # On demande la branche par défaut à GitHub plutôt que de la lire dans le
      # contexte de l'évènement : elle y arrive vide selon la façon dont la
      # poussée est faite, et une condition muette sautait alors toute
      # publication sans rien signaler.
      - name: Regarder quelle branche a le droit de publier
        id: branche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          defaut=$(gh api "repos/${{ github.repository }}" --jq .default_branch)
          echo "defaut=${defaut}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "$defaut" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
            echo "Branche par défaut ($defaut) : le site sera publié."
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Branche ${{ github.ref_name }} : construction seulement."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # enablement: true permet à l'atelier d'activer GitHub Pages lui-même,
      # sans passer par les réglages du dépôt.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Contrôle de poids
        run: npm run poids

      - name: Prévenir si la publication risque d'être refusée
        if: steps.branche.outputs.publier != 'true'
        run: |
          echo "::warning::Branche par défaut du dépôt : ${{ steps.branche.outputs.defaut }}."
          echo "::warning::Cette mise en ligne part de ${{ github.ref_name }}. Si GitHub la"
          echo "::warning::refuse, c'est que l'environnement github-pages n'accepte que la"
          echo "::warning::branche par défaut. Réglage : Settings du dépôt, « Default branch »."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    # On tente toujours la publication : c'est GitHub qui tranche. Une
    # condition posée ici s'est déjà trompée et a sauté toutes les
    # publications en silence, ce qui est pire qu'un échec visible.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v5
